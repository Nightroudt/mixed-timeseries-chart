<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cost / CPA / ROI / Conversions — mixed time-series chart</title>
<style>
  :root {
    --card-bg: #ffffff;
    --card-border: #e7e3f5;
    --ink-primary: #1f2430;
    --ink-secondary: #6b7280;
    --shadow: 0 10px 30px rgba(31, 36, 48, 0.08);

    --color-cost: #f2c94c;      /* area   */
    --color-cost-fill: #fbe79a;
    --color-cpa: #4a8fe0;       /* bar    */
    --color-roi: #2f8f3f;       /* spline */
    --color-conversions: #b026c7; /* line   */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px;
    background: #f4f5f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink-primary);
  }

  .card {
    max-width: 960px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px 20px 8px;
  }

  .card__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .card__title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-primary);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    padding: 4px 6px 14px;
    font-size: 13px;
    color: var(--ink-secondary);
  }

  .legend__item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend__dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
  }

  #chart {
    width: 100%;
    height: 380px;
  }

  /* Tooltip styling is injected via ECharts' extraCssText / formatter below,
     this class only affects the small colored bullets inside it. */
  .tt-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
  }
  .tt-date {
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--ink-primary);
  }
  .tt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    font-size: 14px;
    color: var(--ink-primary);
    line-height: 1.9;
  }
  .tt-row__label { display: flex; align-items: center; }
  .tt-row__value { font-weight: 700; }
</style>
</head>
<body>

  <div class="card">
    <div class="card__header">
      <div class="card__title">Cost · CPA · ROI confirmed · Conversions</div>
    </div>

    <div class="legend" id="legend"></div>

    <div id="chart"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
  <script src="data.js"></script>
  <script src="chart.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cost / CPA / ROI / Conversions — mixed time-series chart</title>
<style>
  /*
    Colors below were sampled pixel-by-pixel from the reference recording
    (CleanShot 2026-06-17 at 17.09.14.gif), not eyeballed — see README.md.
  */
  :root {
    --page-bg: #f4f5f8;       /* this demo page's own wrapper, not part of the widget */
    --widget-bg: #fcebeb;     /* the widget's real background — sampled, not a redaction */
    --ink-primary: #1f2430;
    --ink-secondary: #6b7280;

    --chart-border: #cdcccc;

    --color-cost-fill: #fff0bf;   /* area, solid fill, no outline           */
    --color-cost-dot: #fcf792;    /* tooltip bullet — more saturated than the fill */
    --color-cpa-top: #6695fe;     /* bar, top highlight                     */
    --color-cpa-bottom: #4562c4;  /* bar, base shade                        */
    --color-cpa-dot: #3670fc;     /* tooltip bullet                         */
    --color-roi: #0c8400;         /* spline base                            */
    --color-roi-bright: #3ac201;  /* spline highlight near the low point    */
    --color-conversions: #b500fe; /* line + square markers                  */

    --rail-cell-bg: #f8f6f5;
    --pill-bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--page-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink-primary);
  }

  .widget {
    max-width: 1020px;
    margin: 0 auto;
    display: flex;
    align-items: stretch;
    gap: 10px;
    background: var(--widget-bg);
    border-radius: 16px;
    padding: 16px;
  }

  /* ---- left stat rail -------------------------------------------------- */
  .stat-rail {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 64px;
    flex: none;
  }

  .stat-rail__cell {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--rail-cell-bg);
    border-radius: 10px;
    font-size: 13px;
    color: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
  }

  .stat-rail__cell--period {
    color: var(--ink-primary);
    font-weight: 700;
    background: var(--pill-bg);
  }

  /* ---- chart box ---------------------------------------------------------
     No card surface here on purpose: the reference chart sits directly on
     the widget's own background, bordered only by a thin gray outline. */
  .chart-box {
    position: relative;
    flex: 1;
    min-width: 0;
    border: 1px solid var(--chart-border);
    border-radius: 4px;
  }

  .chart-box__edit-btn {
    position: absolute;
    top: -34px;
    right: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    border: none;
    background: var(--rail-cell-bg);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    color: var(--ink-secondary);
    cursor: pointer;
  }
  .chart-box__edit-btn:hover { filter: brightness(0.97); }

  #chart {
    width: 100%;
    height: 380px;
  }

  /* Tooltip styling is injected via ECharts' extraCssText / formatter below,
     this class only affects the small colored bullets inside it. */
  .tt-dot {
    display: inline-block;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    margin-right: 10px;
  }
  .tt-date {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #1f2430;
  }
  .tt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    font-size: 19px;
    color: #1f2430;
    line-height: 1.75;
  }
  .tt-row__label { display: flex; align-items: center; }
  .tt-row__value { font-weight: 700; }
</style>
</head>
<body>

  <div class="widget">
    <div class="stat-rail" id="statRail"></div>

    <div class="chart-box">
      <button class="chart-box__edit-btn" type="button" aria-label="Edit widget">
        ✏️ ▾
      </button>
      <div id="chart"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
  <script src="data.js"></script>
  <script src="chart.js"></script>
</body>
</html>
